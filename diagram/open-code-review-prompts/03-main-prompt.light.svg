<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150">
  <style>
    :root {
      --paper: #f5f7fc;
      --grid-minor: #e4eaf5;
      --grid-major: #dfe6f2;
      --ink: #21374d;
      --ink-soft: #5a6f88;
      --card: #ffffff;
      --card-edge: #9db2c4;
      --card-shadow: rgba(30,50,70,0.07);
      --green: #059669;
      --red: #dc2626;
      --orange: #d97706;
      --theme: #0e7490;
      --theme-stroke: #0891b2;
      --theme-fill: rgba(8,145,178,0.10);
      --note-bar: #fffdf4;
      --code-bg: #f2f7f4;
      --code-edge: #b9d6c8;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; fill: var(--ink); }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: var(--ink-soft); }
    .h { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    .card-title { font-size: 12px; font-weight: 600; fill: var(--ink-soft); }
    .footer { font-size: 11px; fill: var(--ink-soft); }
  </style>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 40 0 L 20 0 M 60 0 L 40 0 M 80 0 L 60 0 M 100 0 L 80 0" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 0 40 L 0 20 M 0 60 L 0 40 M 0 80 L 0 60 M 0 100 L 0 80" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <rect x="60" y="60" width="20" height="20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-major)" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="rough-soft" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1600" height="1150" fill="var(--paper)"/>
  <rect width="1600" height="1150" fill="url(#grid)"/>
  <text x="60" y="76" class="title">提示词全览 <tspan fill="var(--theme)">03 / 06</tspan> · MAIN 主审查</text>
  <text x="60" y="110" class="subtitle">唯一真正读代码、提评论的 Prompt —— system 2550 B · user 512 B</text>
  <g>
    <rect x="64" y="176" width="840" height="800" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="60" y="170" width="840" height="800" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="92" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="116" cy="200" r="7" fill="#febc2e"/>
    <circle cx="140" cy="200" r="7" fill="#28c840"/>
    <rect x="310.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="480.0" y="205" class="card-title mono" text-anchor="middle">main_task_system.md</text>
  </g>
  <text x="88" y="252" class="h" fill="var(--theme)">## Role · 角色</text>
  <text x="88" y="280" class="body"><tspan>你是</tspan><tspan fill="var(--theme)" font-weight="700">代码审查助手</tspan><tspan>，在 PR 合并前产出专业审查反馈。diff 展示变更，</tspan></text>
  <text x="88" y="304" class="body">需要时用上下文工具读 / 搜相关代码。回复简洁、客观。</text>
  <text x="88" y="356" class="h" fill="var(--theme)">## Capabilities · 能力清单</text>
  <line x1="88" y1="380" x2="106" y2="380" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="384" class="body" font-size="13">逐步思考</text>
  <line x1="88" y1="408" x2="106" y2="408" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="412" class="body" font-size="13"><tspan font-size="13">先读懂 Unified Diff：</tspan><tspan fill="#dc2626" font-weight="700" font-size="13">- 删除</tspan><tspan font-size="13"> / </tspan><tspan fill="#059669" font-weight="700" font-size="13">+ 新增</tspan><tspan font-size="13"> / -+ 相邻即修改 / 其余未变</tspan></text>
  <line x1="88" y1="436" x2="106" y2="436" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="440" class="body" font-size="13"><tspan font-size="13">客观中立、基于事实；上下文不清时</tspan><tspan fill="#dc2626" font-weight="700" font-size="13">先用工具，不臆断</tspan></text>
  <line x1="88" y1="464" x2="106" y2="464" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="468" class="body" font-size="13">针对当前变更提改进意见，聚焦新增代码里的问题</text>
  <line x1="88" y1="492" x2="106" y2="492" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="496" class="body" font-size="13"><tspan fill="#dc2626" font-weight="700" font-size="13">不评论</tspan><tspan font-size="13">正确的代码，也不评论未变化的代码</tspan></text>
  <line x1="88" y1="520" x2="106" y2="520" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="524" class="body" font-size="13"><tspan fill="#dc2626" font-weight="700" font-size="13">不评论</tspan><tspan font-size="13">被删除的代码 —— 删除行只作参考上下文</tspan></text>
  <line x1="88" y1="548" x2="106" y2="548" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="552" class="body" font-size="13">聚焦清晰、实用、全面</text>
  <line x1="88" y1="576" x2="106" y2="576" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="580" class="body" font-size="13">用开发者友好的术语和类比做解释</text>
  <line x1="88" y1="604" x2="106" y2="604" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="608" class="body" font-size="13"><tspan font-size="13">聚焦代码逻辑与功能；不评注释、</tspan><tspan fill="#4338ca" font-weight="700" font-size="13">@Generated</tspan><tspan font-size="13"> 等元数据（除非点名要审）</tspan></text>
  <text x="88" y="660" class="h" fill="#dc2626">## Strict Focus Rules · 焦点红线</text>
  <line x1="88" y1="684" x2="106" y2="684" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="688" class="body" font-size="13"><tspan font-size="13">逐个审查 </tspan><tspan fill="#dc2626" font-weight="700" font-size="13">&lt;review_files&gt;</tspan><tspan font-size="13"> 里列出的每一个文件</tspan></text>
  <line x1="88" y1="712" x2="106" y2="712" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="716" class="body" font-size="13">鼓励跨文件观察：不一致、漏更新、契约破坏</text>
  <line x1="88" y1="740" x2="106" y2="740" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="744" class="body" font-size="13"><tspan font-size="13">上下文工具只用于收集背景 —— 评论必须落在 </tspan><tspan fill="#dc2626" font-weight="700" font-size="13">&lt;review_files&gt;</tspan><tspan font-size="13"> 内</tspan></text>
  <text x="118" y="772" class="body"><tspan fill="#dc2626" font-weight="700">绝不产出针对组外文件的评论</tspan></text>
  <text x="88" y="824" class="h" fill="var(--theme)">## Reply Limit · 收尾纪律</text>
  <line x1="88" y1="848" x2="106" y2="848" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="852" class="body" font-size="13"><tspan font-size="13">调 task_done 前，确认每个 </tspan><tspan fill="var(--theme)" font-weight="700" font-size="13">&lt;file&gt;</tspan><tspan font-size="13"> 都单独过了一遍</tspan></text>
  <line x1="88" y1="876" x2="106" y2="876" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="880" class="body" font-size="12"><tspan font-size="12">实现文件 ≠ 头文件 / 接口 / 配置；文件小或是次要成员</tspan><tspan fill="#dc2626" font-weight="700" font-size="12">都不是跳过理由</tspan></text>
  <line x1="88" y1="904" x2="106" y2="904" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="908" class="body" font-size="12"><tspan font-size="12">问题确认 → </tspan><tspan fill="#059669" font-weight="700" font-size="12">code_comment</tspan><tspan font-size="12"> · 需上下文 → 调工具 · 完成 → </tspan><tspan fill="#059669" font-weight="700" font-size="12">task_done</tspan></text>
  <g>
    <rect x="944" y="176" width="600" height="800" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="940" y="170" width="600" height="800" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="972" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="996" cy="200" r="7" fill="#febc2e"/>
    <circle cx="1020" cy="200" r="7" fill="#28c840"/>
    <rect x="1070.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="1240.0" y="205" class="card-title mono" text-anchor="middle">main_task_user.md</text>
  </g>
  <text x="968" y="252" class="h" fill="var(--theme)">## 模板 · 程序注入</text>
  <text x="968" y="280" class="small">组外其他变更文件：</text>
  <rect x="968" y="298" width="190" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1063.0" y="318" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{change_files}}</text>
  <text x="968" y="354" class="small">&lt;review_files&gt; · 本组 diff：</text>
  <rect x="968" y="372" width="140" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1038.0" y="392" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{diffs}}</text>
  <text x="968" y="428" class="small">Current time：</text>
  <rect x="968" y="446" width="280" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1108.0" y="466" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{current_system_date_time}}</text>
  <text x="968" y="502" class="small">### Requirement Background (Optional)</text>
  <rect x="968" y="520" width="250" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1093.0" y="540" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{requirement_background}}</text>
  <text x="968" y="576" class="small">### Review Checklist · 审查清单</text>
  <rect x="968" y="594" width="170" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1053.0" y="614" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{system_rule}}</text>
  <text x="968" y="650" class="small">### Review Plan · 检索计划</text>
  <rect x="968" y="668" width="190" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1063.0" y="688" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{plan_guidance}}</text>
  <text x="968" y="716" class="small"><tspan>← 只 R1 注入；</tspan><tspan fill="#dc2626" font-weight="700">R2 起整段移除</tspan></text>
  <text x="968" y="754" class="small">### Previously Confirmed Findings</text>
  <rect x="968" y="772" width="220" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1078.0" y="792" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{confirmed_comments}}</text>
  <text x="968" y="820" class="small"><tspan>← R2 起非空：上轮确认的问题摘要</tspan></text>
  <text x="968" y="862" class="h" fill="var(--theme)">## 收尾一句话</text>
  <text x="968" y="890" class="small">「Now please review the code changes</text>
  <text x="968" y="912" class="small">in &lt;review_files&gt; above.」</text>
  <g transform="rotate(-0.4 800 1038)">
    <rect x="60" y="1010" width="1480" height="56" rx="14" fill="var(--note-bar)" stroke="var(--theme-stroke)" stroke-width="1.8" filter="url(#rough)"/>
    <text x="800" y="1044" class="body" font-size="15" text-anchor="middle"><tspan>MAIN 的判断 → </tspan><tspan fill="var(--theme)" font-weight="700">code_comment</tspan><tspan> → 异步定位 → Collector → FILTER · 每轮工具请求默认上限 100 次</tspan></text>
  </g>
  <text x="1540" y="1120" class="footer mono" text-anchor="end">alibaba/open-code-review · internal/config/template/prompts/</text>
</svg>
