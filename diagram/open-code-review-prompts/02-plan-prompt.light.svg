<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <style>
    :root {
      --paper: #f5f7fc;
      --grid-minor: #e4eaf5;
      --grid-major: #dfe6f2;
      --ink: #21374d;
      --ink-soft: #5a6f88;
      --card: #ffffff;
      --card-edge: #9db2c4;
      --card-shadow: rgba(30,50,70,0.07);
      --green: #059669;
      --red: #dc2626;
      --orange: #d97706;
      --theme: #1d4ed8;
      --theme-stroke: #2563eb;
      --theme-fill: rgba(37,99,235,0.10);
      --note-bar: #fffdf4;
      --code-bg: #f2f7f4;
      --code-edge: #b9d6c8;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; fill: var(--ink); }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: var(--ink-soft); }
    .h { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    .card-title { font-size: 12px; font-weight: 600; fill: var(--ink-soft); }
    .footer { font-size: 11px; fill: var(--ink-soft); }
  </style>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 40 0 L 20 0 M 60 0 L 40 0 M 80 0 L 60 0 M 100 0 L 80 0" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 0 40 L 0 20 M 0 60 L 0 40 M 0 80 L 0 60 M 0 100 L 0 80" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <rect x="60" y="60" width="20" height="20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-major)" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="rough-soft" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="var(--paper)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <text x="60" y="76" class="title">提示词全览 <tspan fill="var(--theme)">02 / 06</tspan> · PLAN 审查计划</text>
  <text x="60" y="110" class="subtitle">大改动先列「准备查什么」——纯文本、不解析、不执行，只服务 MAIN 第 1 轮 —— system 2563 B · user 387 B</text>
  <g>
    <rect x="64" y="176" width="840" height="720" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="60" y="170" width="840" height="720" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="92" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="116" cy="200" r="7" fill="#febc2e"/>
    <circle cx="140" cy="200" r="7" fill="#28c840"/>
    <rect x="310.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="480.0" y="205" class="card-title mono" text-anchor="middle">plan_task_system.md</text>
  </g>
  <text x="88" y="252" class="h" fill="var(--theme)">## Role · 角色</text>
  <text x="88" y="280" class="body"><tspan>你是</tspan><tspan fill="var(--theme)" font-weight="700">代码审查任务规划专家</tspan><tspan>。手里有一组可检索变更上下文的工具；</tspan></text>
  <text x="88" y="304" class="body">职责：分析变更内容、识别风险点，为每个风险点规划工具调用策略。</text>
  <text x="88" y="356" class="h" fill="var(--theme)">## 输出格式 · 严格纯文本，零废话</text>
  <text x="88" y="384" class="body"><tspan fill="#2563eb" font-weight="700">Summary:</tspan><tspan>（一行简述本次变更的目的与范围）</tspan></text>
  <text x="88" y="408" class="body"><tspan fill="#2563eb" font-weight="700">Issues</tspan></text>
  <text x="88" y="432" class="body"><tspan>1. </tspan><tspan fill="#d97706" font-weight="700">[high|medium|low]</tspan><tspan>（具体问题与潜在影响）</tspan></text>
  <text x="88" y="456" class="body"><tspan>→ (工具名) (调用参数) —</tspan><tspan fill="var(--ink-soft)">（为什么调它、与问题的关系）</tspan></text>
  <text x="88" y="480" class="body">2. [high|medium|low]（…）　编号连续、按严重度降序</text>
  <text x="88" y="504" class="body"><tspan fill="#dc2626" font-weight="700">禁止：</tspan><tspan fill="#dc2626">前言 / 结语 / Markdown 标题（# 开头）/ 代码围栏（```）</tspan></text>
  <text x="88" y="556" class="h" fill="var(--theme)">## 分析规则 · Analysis Rules</text>
  <line x1="88" y1="580" x2="106" y2="580" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="584" class="body" font-size="13"><tspan font-size="13">范围：只分析</tspan><tspan fill="var(--theme)" font-weight="700" font-size="13">新增与修改</tspan><tspan font-size="13">的代码，忽略已删除的代码</tspan></text>
  <line x1="88" y1="608" x2="106" y2="608" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="612" class="body" font-size="13"><tspan font-size="13">排序：问题连续编号，按严重度降序（</tspan><tspan fill="#d97706" font-weight="700" font-size="13">high → medium → low</tspan><tspan font-size="13">）</tspan></text>
  <line x1="88" y1="636" x2="106" y2="636" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="640" class="body" font-size="13"><tspan fill="#dc2626" font-weight="700" font-size="13">high</tspan><tspan font-size="13"> = 安全漏洞 / 数据丢失 / 系统崩溃 / 关键功能失效</tspan></text>
  <line x1="118" y1="660" x2="136" y2="660" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="148" y="664" class="body" font-size="12"><tspan fill="#d97706" font-weight="700" font-size="12">medium</tspan><tspan font-size="12"> = 性能 / 可维护性 / 边缘情况；</tspan><tspan fill="#059669" font-weight="700" font-size="12">low</tspan><tspan font-size="12"> = 风格 / 可读性</tspan></text>
  <line x1="88" y1="712" x2="106" y2="712" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="716" class="body" font-size="13"><tspan font-size="13">工具：只描述调用意图，</tspan><tspan fill="#dc2626" font-weight="700" font-size="13">绝不真正调用</tspan><tspan font-size="13">（写在 → 行上）</tspan></text>
  <line x1="88" y1="740" x2="106" y2="740" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="744" class="body" font-size="13">描述：每个问题覆盖三维 —— 位置、性质、潜在影响</text>
  <line x1="88" y1="768" x2="106" y2="768" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="772" class="body" font-size="13"><tspan font-size="13">空结果：无风险就输出 Summary + Issues + </tspan><tspan fill="#059669" font-weight="700" font-size="13">(none)</tspan><tspan font-size="13">，不硬凑问题</tspan></text>
  <text x="88" y="800" class="h" fill="var(--theme)">## 工具说明 · <tspan class="mono">{{plan_tools}}</tspan></text>
  <text x="88" y="828" class="small">这轮只是「认识工具」，真正调用发生在下一步 MAIN（流程图 04）</text>
  <g>
    <rect x="944" y="176" width="600" height="720" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="940" y="170" width="600" height="720" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="972" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="996" cy="200" r="7" fill="#febc2e"/>
    <circle cx="1020" cy="200" r="7" fill="#28c840"/>
    <rect x="1070.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="1240.0" y="205" class="card-title mono" text-anchor="middle">plan_task_user.md</text>
  </g>
  <text x="968" y="252" class="h" fill="var(--theme)">## Task · 任务</text>
  <text x="968" y="280" class="small">其他变更文件（不在本组）：</text>
  <rect x="968" y="298" width="190" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1063.0" y="318" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{change_files}}</text>
  <text x="968" y="354" class="small">本组完整 diff（Unified Diff）：</text>
  <rect x="968" y="372" width="544" height="130" rx="10" fill="var(--code-bg)" stroke="var(--code-edge)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="988" y="398" class="mono" font-size="12" fill="var(--ink-soft)">@@ session.go @@</text>
  <text x="988" y="421" class="mono" font-size="12" fill="#dc2626">- if err != nil { return err }</text>
  <text x="988" y="444" class="mono" font-size="12" fill="#059669">+ if err != nil {</text>
  <text x="988" y="467" class="mono" font-size="12" fill="#059669">+     log.Warn("session expired")</text>
  <text x="988" y="490" class="mono" font-size="12" fill="#059669">+     return ErrSessionExpired</text>
  <text x="988" y="513" class="mono" font-size="12" fill="#059669">+ }</text>
  <text x="968" y="532" class="small">Current time in the real world:</text>
  <rect x="968" y="550" width="280" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1108.0" y="570" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{current_system_date_time}}</text>
  <text x="968" y="606" class="small">### Requirement Background (Optional)</text>
  <rect x="968" y="624" width="250" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1093.0" y="644" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{requirement_background}}</text>
  <text x="968" y="680" class="small">### Review Checklist · 审查清单</text>
  <rect x="968" y="698" width="170" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1053.0" y="718" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{system_rule}}</text>
  <text x="968" y="758" class="h" fill="var(--theme)">## 唯一做的事</text>
  <text x="968" y="786" class="small">「分析上述变更，输出结构化审查计划。」</text>
  <text x="968" y="812" class="small"><tspan>输出即 planResult —— </tspan><tspan fill="var(--theme)" font-weight="700">原样保存、不解析、不执行</tspan></text>
  <text x="968" y="836" class="small"><tspan>只进 MAIN R1 的 Prompt；</tspan><tspan fill="#dc2626" font-weight="700">R2 起整段移除</tspan><tspan>（流程图 04）</tspan></text>
  <g transform="rotate(-0.4 800 988)">
    <rect x="60" y="960" width="1480" height="56" rx="14" fill="var(--note-bar)" stroke="var(--theme-stroke)" stroke-width="1.8" filter="url(#rough)"/>
    <text x="800" y="994" class="body" font-size="15" text-anchor="middle"><tspan>PLAN 只服务 MAIN R1：</tspan><tspan fill="var(--theme)" font-weight="700">planResult 原样注入 R1</tspan><tspan>，是检索计划不是结论 · R2 起整段移除</tspan></text>
  </g>
  <text x="1540" y="1070" class="footer mono" text-anchor="end">alibaba/open-code-review · internal/config/template/prompts/</text>
</svg>
