<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080">
  <style>
    :root {
      --paper: #f5f7fc;
      --grid-minor: #e4eaf5;
      --grid-major: #dfe6f2;
      --ink: #21374d;
      --ink-soft: #5a6f88;
      --card: #ffffff;
      --card-edge: #9db2c4;
      --card-shadow: rgba(30,50,70,0.07);
      --green: #059669;
      --red: #dc2626;
      --orange: #d97706;
      --theme: #be185d;
      --theme-stroke: #db2777;
      --theme-fill: rgba(219,39,119,0.10);
      --note-bar: #fffdf4;
      --code-bg: #f2f7f4;
      --code-edge: #b9d6c8;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; fill: var(--ink); }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: var(--ink-soft); }
    .h { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    .card-title { font-size: 12px; font-weight: 600; fill: var(--ink-soft); }
    .footer { font-size: 11px; fill: var(--ink-soft); }
  </style>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 40 0 L 20 0 M 60 0 L 40 0 M 80 0 L 60 0 M 100 0 L 80 0" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 0 40 L 0 20 M 0 60 L 0 40 M 0 80 L 0 60 M 0 100 L 0 80" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <rect x="60" y="60" width="20" height="20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-major)" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="rough-soft" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1600" height="1080" fill="var(--paper)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>
  <text x="60" y="76" class="title">提示词全览 <tspan fill="var(--theme)">05 / 06</tspan> · COMPRESSION 记忆压缩</text>
  <text x="60" y="110" class="subtitle">把本轮旧工具轮次压成五维摘要，挂回初始 user，只服务当前轮 —— system 1760 B · user 12 B</text>
  <g>
    <rect x="64" y="176" width="840" height="760" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="60" y="170" width="840" height="760" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="92" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="116" cy="200" r="7" fill="#febc2e"/>
    <circle cx="140" cy="200" r="7" fill="#28c840"/>
    <rect x="310.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="480.0" y="205" class="card-title mono" text-anchor="middle">memory_compression_task_system.md</text>
  </g>
  <text x="88" y="252" class="h" fill="var(--theme)">## Goal · 角色</text>
  <text x="88" y="280" class="body"><tspan>你是代码审查对话的</tspan><tspan fill="var(--theme)" font-weight="700">摘要助手</tspan><tspan>。输入是审查助手与模型的完整对话</tspan></text>
  <text x="88" y="304" class="body">（含工具调用及结果）；把它压成结构化摘要，让审查助手从当前</text>
  <text x="88" y="328" class="body"><tspan>状态接着干，</tspan><tspan fill="var(--theme)" font-weight="700">而不是从头再来</tspan><tspan>。</tspan></text>
  <text x="88" y="380" class="h" fill="var(--theme)">## 输出格式 · 五个维度，显式标题</text>
  <rect x="88" y="400" width="784" height="200" rx="10" fill="var(--code-bg)" stroke="var(--code-edge)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="108" y="426" class="mono" font-size="12" fill="var(--theme)">### Identified Code Issues</text>
  <text x="108" y="449" class="mono" font-size="12" fill="#dc2626">- [HIGH] `UserService.go:45` — 并发读写 map 无锁</text>
  <text x="108" y="472" class="mono" font-size="12" fill="#d97706">- [MEDIUM] `config_loader.go:12` — 错误处理不全</text>
  <text x="108" y="505" class="mono" font-size="12" fill="var(--theme)">### Tool Call Conclusions</text>
  <text x="108" y="528" class="mono" font-size="12">- search_file("database"): 无相关配置问题</text>
  <text x="108" y="561" class="mono" font-size="12" fill="var(--theme)">### Completed Tasks</text>
  <text x="108" y="584" class="mono" font-size="12">- 已检查 session.go 的刷新实现</text>
  <text x="520" y="426" class="mono" font-size="12" fill="var(--theme)">### Pending Tasks</text>
  <text x="520" y="449" class="mono" font-size="12">- 还需确认 session_test.go 是否覆盖</text>
  <text x="520" y="482" class="mono" font-size="12" fill="var(--theme)">### Current Focus</text>
  <text x="520" y="505" class="mono" font-size="12">- 正在确认过期会话能否刷新续期</text>
  <text x="88" y="660" class="h" fill="var(--theme)">## 规则 · Rules</text>
  <line x1="88" y1="684" x2="106" y2="684" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="688" class="body" font-size="13"><tspan font-size="13">不写具体代码细节，只引用</tspan><tspan fill="var(--theme)" font-weight="700" font-size="13">文件路径与问题类型</tspan></text>
  <line x1="88" y1="712" x2="106" y2="712" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="716" class="body" font-size="13">去重，不重复啰嗦</text>
  <line x1="88" y1="740" x2="106" y2="740" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="744" class="body" font-size="13"><tspan font-size="13">没内容的维度</tspan><tspan fill="#059669" font-weight="700" font-size="13">直接省略</tspan></text>
  <line x1="88" y1="768" x2="106" y2="768" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="772" class="body" font-size="13">完成 / 待办事项用完整句子描述</text>
  <line x1="88" y1="796" x2="106" y2="796" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="800" class="body" font-size="13">current_focus 至多一句，不超过一句</text>
  <text x="88" y="852" class="h" fill="var(--theme)">## 空摘要怎么办</text>
  <text x="88" y="880" class="small"><tspan>压缩失败或产出空摘要 → </tspan><tspan fill="#dc2626" font-weight="700">保留原对话，不硬换</tspan><tspan>（流程图 11 底部）</tspan></text>
  <g>
    <rect x="944" y="176" width="600" height="760" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="940" y="170" width="600" height="760" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="972" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="996" cy="200" r="7" fill="#febc2e"/>
    <circle cx="1020" cy="200" r="7" fill="#28c840"/>
    <rect x="1070.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="1240.0" y="205" class="card-title mono" text-anchor="middle">memory_compression_task_user.md</text>
  </g>
  <text x="968" y="252" class="h" fill="var(--theme)">## 模板 · 就这么简</text>
  <rect x="968" y="276" width="140" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1038.0" y="296" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{context}}</text>
  <text x="968" y="330" class="small">整个对话原样塞进来，含全部工具轮次</text>
  <text x="968" y="382" class="h" fill="var(--theme)">## 谁会被压缩</text>
  <line x1="968" y1="406" x2="986" y2="406" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="410" class="body" font-size="13"><tspan font-size="13">只压 </tspan><tspan fill="var(--theme)" font-weight="700" font-size="13">compress 区</tspan><tspan font-size="13">：较旧的完整工具轮次</tspan></text>
  <line x1="968" y1="434" x2="986" y2="434" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="438" class="body" font-size="13"><tspan fill="#4338ca" font-weight="700" font-size="13">frozen</tspan><tspan font-size="13">（开头）与 </tspan><tspan fill="#4338ca" font-weight="700" font-size="13">active</tspan><tspan font-size="13">（最近轮次）原样保留</tspan></text>
  <text x="968" y="490" class="h" fill="var(--theme)">## 摘要去哪</text>
  <line x1="968" y1="514" x2="986" y2="514" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="518" class="body" font-size="13">追加到初始 user 之后，只服务当前轮</text>
  <line x1="968" y1="542" x2="986" y2="542" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="546" class="body" font-size="13"><tspan font-size="13">跨轮传递的是 confirmed，</tspan><tspan fill="#dc2626" font-weight="700" font-size="13">不是摘要</tspan></text>
  <text x="968" y="598" class="h" fill="var(--theme)">## 触发时机 · 阈值</text>
  <line x1="968" y1="622" x2="986" y2="622" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="626" class="body" font-size="13"><tspan fill="#d97706" font-weight="700" font-size="13">≥60%</tspan><tspan font-size="13"> 后台异步压，主循环不阻塞</tspan></text>
  <line x1="968" y1="650" x2="986" y2="650" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="998" y="654" class="body" font-size="13"><tspan fill="#dc2626" font-weight="700" font-size="13">≥80%</tspan><tspan font-size="13"> 同步等；压完仍 </tspan><tspan fill="#dc2626" font-weight="700" font-size="13">≥80% 停本轮</tspan></text>
  <g transform="rotate(-0.4 800 968)">
    <rect x="60" y="940" width="1480" height="56" rx="14" fill="var(--note-bar)" stroke="var(--theme-stroke)" stroke-width="1.8" filter="url(#rough)"/>
    <text x="800" y="974" class="body" font-size="15" text-anchor="middle"><tspan>COMPRESSION 摘要挂回初始 user · </tspan><tspan fill="var(--theme)" font-weight="700">只活一轮</tspan><tspan> · 失败 / 空摘要保留原对话（流程图 11）</tspan></text>
  </g>
  <text x="1540" y="1050" class="footer mono" text-anchor="end">alibaba/open-code-review · internal/config/template/prompts/</text>
</svg>
