<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 990">
  <style>
    :root {
      --paper: #f5f7fc;
      --grid-minor: #e4eaf5;
      --grid-major: #dfe6f2;
      --ink: #21374d;
      --ink-soft: #5a6f88;
      --card: #ffffff;
      --card-edge: #9db2c4;
      --card-shadow: rgba(30,50,70,0.07);
      --green: #059669;
      --red: #dc2626;
      --orange: #d97706;
      --theme: #7e22ce;
      --theme-stroke: #9333ea;
      --theme-fill: rgba(147,51,234,0.10);
      --note-bar: #fffdf4;
      --code-bg: #f2f7f4;
      --code-edge: #b9d6c8;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; fill: var(--ink); }
    .title { font-size: 30px; font-weight: 800; }
    .subtitle { font-size: 15px; fill: var(--ink-soft); }
    .h { font-size: 16px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
    .card-title { font-size: 12px; font-weight: 600; fill: var(--ink-soft); }
    .footer { font-size: 11px; fill: var(--ink-soft); }
  </style>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 40 0 L 20 0 M 60 0 L 40 0 M 80 0 L 60 0 M 100 0 L 80 0" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 0 40 L 0 20 M 0 60 L 0 40 M 0 80 L 0 60 M 0 100 L 0 80" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <rect x="60" y="60" width="20" height="20" fill="none" stroke="var(--grid-minor)" stroke-width="0.6"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="var(--grid-major)" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <filter id="rough-soft" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
  </defs>
  <rect width="1600" height="990" fill="var(--paper)"/>
  <rect width="1600" height="990" fill="url(#grid)"/>
  <text x="60" y="76" class="title">提示词全览 <tspan fill="var(--theme)">01 / 06</tspan> · GROUPING 文件分组</text>
  <text x="60" y="110" class="subtitle">模型只看得见文件元数据，吐出来的只有 JSON 数组 —— system 905 B · user 209 B</text>
  <g>
    <rect x="64" y="176" width="840" height="660" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="60" y="170" width="840" height="660" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="92" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="116" cy="200" r="7" fill="#febc2e"/>
    <circle cx="140" cy="200" r="7" fill="#28c840"/>
    <rect x="310.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="480.0" y="205" class="card-title mono" text-anchor="middle">grouping_task_system.md</text>
  </g>
  <text x="88" y="252" class="h" fill="var(--theme)">## Role · 角色</text>
  <text x="88" y="280" class="body"><tspan>你是代码审查的</tspan><tspan fill="var(--theme)" font-weight="700">文件分组助手</tspan><tspan>：把变更文件分成语义相关的簇，</tspan></text>
  <text x="88" y="304" class="body">同一簇的文件应当被放在一起审查。</text>
  <text x="88" y="356" class="h" fill="var(--theme)">## 分组依据 · 同组文件通常</text>
  <line x1="88" y1="380" x2="106" y2="380" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="384" class="body" font-size="13">属于同一模块 / 功能</text>
  <line x1="88" y1="408" x2="106" y2="408" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="412" class="body" font-size="13"><tspan font-size="13">存在生产 / 消费关系（</tspan><tspan fill="#2563eb" font-weight="700" font-size="13">接口与实现</tspan><tspan font-size="13">）</tspan></text>
  <line x1="88" y1="436" x2="106" y2="436" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="440" class="body" font-size="13"><tspan font-size="13">是同一资源的 i18n / 配置变体（</tspan><tspan fill="#4338ca" font-weight="700" font-size="13">message_en ↔ message_zh</tspan><tspan font-size="13">）</tspan></text>
  <line x1="88" y1="464" x2="106" y2="464" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="468" class="body" font-size="13">同目录、协同完成同一件事</text>
  <text x="88" y="520" class="h" fill="var(--theme)">## 索引约定 · 输入长什么样</text>
  <rect x="88" y="538" width="312" height="30" rx="8" fill="var(--code-bg)" stroke="var(--code-edge)" stroke-width="1.3" filter="url(#rough-soft)"/>
  <text x="104" y="558" class="mono" font-size="12">[0] MODIFIED   path/to/file (+12/-3)</text>
  <text x="88" y="596" class="body"><tspan>每个文件都带一个从零开始的索引 —— 用整数索引指代，</tspan><tspan fill="#dc2626" font-weight="700">绝不用路径</tspan><tspan>。</tspan></text>
  <text x="88" y="648" class="h" fill="var(--theme)">## 规则 · Rules</text>
  <line x1="88" y1="672" x2="106" y2="672" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="676" class="body" font-size="13"><tspan font-size="13">每个文件索引必须</tspan><tspan fill="#dc2626" font-weight="700" font-size="13">恰好出现一次</tspan><tspan font-size="13">，且只能在一个组里</tspan></text>
  <line x1="88" y1="700" x2="106" y2="700" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="704" class="body" font-size="13"><tspan font-size="13">与其他文件无关时，允许单独成组（</tspan><tspan fill="#d97706" font-weight="700" font-size="13">1 个也算</tspan><tspan font-size="13">）</tspan></text>
  <line x1="88" y1="728" x2="106" y2="728" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="732" class="body" font-size="13"><tspan font-size="13">每组最多 </tspan><tspan fill="#d97706" font-weight="700" font-size="13">10</tspan><tspan font-size="13"> 个文件</tspan></text>
  <line x1="88" y1="756" x2="106" y2="756" stroke="var(--theme)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="760" class="body" font-size="13"><tspan font-size="13">每组的 </tspan><tspan fill="#4338ca" font-weight="700" font-size="13">"files"</tspan><tspan font-size="13"> 字段是整数索引组成的数组</tspan></text>
  <line x1="88" y1="784" x2="106" y2="784" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="788" class="body" font-size="13"><tspan fill="#059669" font-weight="700" font-size="13">只输出一个 JSON 数组</tspan><tspan fill="#059669" font-size="13">，不要任何其他文字</tspan></text>
  <g>
    <rect x="944" y="176" width="600" height="660" rx="14" fill="var(--card-shadow)" filter="url(#rough)"/>
    <rect x="940" y="170" width="600" height="660" rx="14" fill="var(--card)" stroke="var(--card-edge)" stroke-width="1.8" filter="url(#rough)"/>
    <circle cx="972" cy="200" r="7" fill="#ff5f57"/>
    <circle cx="996" cy="200" r="7" fill="#febc2e"/>
    <circle cx="1020" cy="200" r="7" fill="#28c840"/>
    <rect x="1070.0" y="187" width="340" height="27" rx="13" fill="#f3f6f9" stroke="var(--card-edge)" stroke-width="1.2" filter="url(#rough-soft)"/>
    <text x="1240.0" y="205" class="card-title mono" text-anchor="middle">grouping_task_user.md</text>
  </g>
  <text x="968" y="252" class="h" fill="var(--theme)">## Task · 任务</text>
  <text x="968" y="280" class="body">对以下变更文件分组：</text>
  <rect x="968" y="298" width="170" height="30" rx="15" fill="rgba(217,119,6,0.14)" stroke="var(--orange)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="1053.0" y="318" class="mono" font-size="13" font-weight="700" fill="var(--orange)" text-anchor="middle">{{file_list}}</text>
  <text x="968" y="356" class="body"><tspan>回答一个 JSON 数组，其中 </tspan><tspan fill="#4338ca" font-weight="700">"files"</tspan><tspan> 是各文件</tspan></text>
  <text x="968" y="380" class="body">旁括号里标注的整数索引：</text>
  <rect x="968" y="404" width="500" height="66" rx="10" fill="var(--code-bg)" stroke="var(--code-edge)" stroke-width="1.4" filter="url(#rough-soft)"/>
  <text x="988" y="430" class="mono" font-size="12">[{"label": "short theme description",</text>
  <text x="988" y="453" class="mono" font-size="12">  "files": [0, 1]}]</text>
  <text x="968" y="508" class="h" fill="var(--theme)">## 变量注入 · 程序渲染</text>
  <text x="968" y="536" class="small"><tspan fill="#d97706" font-weight="700">{{file_list}}</tspan><tspan> ← 8 个文件的元数据行（索引 + 状态 + 增删行数）</tspan></text>
  <text x="968" y="560" class="small"><tspan>模型全程</tspan><tspan fill="#dc2626" font-weight="700">看不到 diff 内容</tspan></text>
  <text x="968" y="584" class="small">输出交程序解析 → 还原成 A–E 审查组（见流程图 03）</text>
  <text x="968" y="636" class="h" fill="var(--theme)">## 输出即契约</text>
  <text x="968" y="664" class="small"><tspan>label = 短主题描述 · </tspan><tspan>files = 整数索引数组</tspan></text>
  <text x="968" y="688" class="small"><tspan>程序只认这份 JSON，</tspan><tspan fill="#dc2626" font-weight="700">其余输出一律丢弃</tspan></text>
  <text x="968" y="724" class="small">分组失败 / 索引越界 → 程序兜底降级（流程图 03 下半区）</text>
  <g transform="rotate(-0.4 800 888)">
    <rect x="60" y="860" width="1480" height="56" rx="14" fill="var(--note-bar)" stroke="var(--theme-stroke)" stroke-width="1.8" filter="url(#rough)"/>
    <text x="800" y="894" class="body" font-size="15" text-anchor="middle"><tspan>GROUPING 只做一件事：</tspan><tspan fill="var(--theme)" font-weight="700">分堆</tspan><tspan> · 不产生计划 · 不产生评论 · 程序负责校验、兜底与并行分发</tspan></text>
  </g>
  <text x="1540" y="960" class="footer mono" text-anchor="end">alibaba/open-code-review · internal/config/template/prompts/</text>
</svg>
