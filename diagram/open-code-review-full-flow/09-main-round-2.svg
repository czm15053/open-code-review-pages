    <polygon points="1387,50 1395,54 1395,64 1387,68 1379,64 1379,54" fill="var(--filter-fill)" stroke="var(--filter-stroke)"/>
    <text x="1460" y="65" class="node-sub center" fill="var(--filter-stroke)">FILTER</text>
  </g>

  <!-- Connections behind the nodes -->
  <path d="M 400 245 L 400 288" class="flow-main" marker-end="url(#arrow-main)"/>
  <path d="M 1200 245 L 1200 288" class="flow-main" marker-end="url(#arrow-main)"/>
  <text x="420" y="272" class="tiny">重新渲染</text>
  <text x="1220" y="272" class="tiny">重新渲染</text>
  <path d="M 740 324 L 858 324" class="flow-main" marker-end="url(#arrow-main)"/>
