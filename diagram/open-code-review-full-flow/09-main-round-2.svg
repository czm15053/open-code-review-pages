  <path d="M 740 394 L 858 394" class="exception" marker-end="url(#arrow-open)"/>
  <text x="800" y="377" class="tiny center" fill="var(--danger)">不继承完整工具历史</text>
  <path d="M 715 652 L 858 652" fill="none" stroke="var(--data-stroke)" stroke-width="2.5" marker-end="url(#arrow-data)"/>
  <text x="800" y="637" class="tiny center" fill="var(--data-stroke)">confirmed</text>

  <!-- Shared prompt ingredients -->
  <rect x="40" y="140" width="1520" height="105" rx="14" fill="var(--mask)"/>
  <rect x="40" y="140" width="1520" height="105" rx="14" fill="var(--panel)" stroke="var(--soft-line)" stroke-width="1.2"/>
  <text x="64" y="171" class="section">两轮都重新渲染的共同材料</text>
  <text x="64" y="197" class="node-sub">相同输入 ≠ 相同消息历史</text>
  <text x="64" y="221" class="tiny">medium 默认最多 2 轮 · R1 正常且有评论通过 FILTER</text>

